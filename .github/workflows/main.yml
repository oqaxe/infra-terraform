name: Terraform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Terraform
        run: |
          apt-get update && apt-get install -y terraform

      - name: Run Terraform
        run: |
          terraform init
          terraform apply -auto-approve